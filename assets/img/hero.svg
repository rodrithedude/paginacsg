<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <!-- Imagen provisional: reemplazar por la foto principal de CSG -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c9c9"/><stop offset="1" stop-color="#e3e3e3"/>
    </linearGradient>
    <pattern id="form" width="40" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 21.5h40M39.5 0v22" stroke="#000" stroke-opacity=".07"/>
    </pattern>
    <pattern id="mull" width="46" height="40" patternUnits="userSpaceOnUse">
      <rect width="46" height="40" fill="#2c2c2c"/><rect x="2" width="3" height="40" fill="#555"/>
      <rect x="6" y="6" width="36" height="28" fill="#3a3a3a"/>
    </pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .45 0 0 0 0 .45 0 0 0 .22 0"/></filter>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>

  <!-- volumen alto central -->
  <polygon points="760,170 835,135 835,640 760,640" fill="#707070"/>
  <rect x="835" y="135" width="330" height="505" fill="#a6a6a6"/>
  <rect x="835" y="135" width="330" height="505" fill="url(#form)"/>
  <rect x="835" y="135" width="330" height="10" fill="#bdbdbd"/>
  <polygon points="1165,135 1215,165 1215,640 1165,640" fill="#8c8c8c"/>
  <rect x="1215" y="250" width="160" height="390" fill="#b3b3b3"/>
  <rect x="1215" y="250" width="160" height="390" fill="url(#form)"/>
  <rect x="1375" y="300" width="120" height="340" fill="#9b9b9b"/>

  <!-- volumen escalonado -->
  <rect x="610" y="270" width="150" height="370" fill="#b9b9b9"/>
  <rect x="610" y="270" width="150" height="370" fill="url(#form)"/>
  <rect x="690" y="215" width="70" height="55" fill="#ababab"/>

  <!-- torres izquierda -->
  <rect x="150" y="345" width="115" height="300" fill="#bcbcbc"/>
  <rect x="150" y="345" width="115" height="300" fill="url(#form)"/>
  <rect x="265" y="345" width="34" height="300" fill="#858585"/>
  <rect x="299" y="300" width="88" height="345" fill="#c6c6c6"/>
  <rect x="299" y="300" width="88" height="345" fill="url(#form)"/>
  <rect x="387" y="300" width="40" height="345" fill="#8e8e8e"/>
  <rect x="427" y="292" width="34" height="353" fill="#7a7a7a"/>
  <rect x="461" y="292" width="128" height="353" fill="#b5b5b5"/>
  <rect x="461" y="292" width="128" height="353" fill="url(#form)"/>
  <rect x="589" y="380" width="21" height="265" fill="#808080"/>

  <!-- terrazas horizontales -->
  <rect x="90" y="560" width="1510" height="44" fill="#c4c4c4"/>
  <rect x="90" y="560" width="1510" height="44" fill="url(#form)"/>
  <rect x="90" y="604" width="1510" height="30" fill="url(#mull)"/>
  <rect x="30" y="634" width="1570" height="46" fill="#b2b2b2"/>
  <rect x="30" y="634" width="1570" height="46" fill="url(#form)"/>
  <rect x="30" y="680" width="1570" height="30" fill="url(#mull)"/>
  <rect x="0" y="710" width="1600" height="40" fill="#bdbdbd"/>
  <rect x="0" y="710" width="1600" height="40" fill="url(#form)"/>
  <rect x="0" y="750" width="1600" height="50" fill="#5d5d5d"/>
  <rect x="0" y="750" width="1600" height="6" fill="#3a3a3a"/>

  <rect width="1600" height="800" filter="url(#grain)"/>
</svg>
