  <path d="M243 285c10 40 35 60 67 62-20-10-35-30-40-62Z" fill="#5f5f5f"/>
  <!-- casco -->
  <path d="M222 232c0-62 40-104 90-104s90 42 90 104Z" fill="url(#helmet)"/>
  <path d="M300 130h22v102h-22z" fill="#d7d7d7"/>
  <path d="M200 228h228c6 0 10 6 6 12-5 8-15 12-26 12H222c-12 0-22-4-26-12-3-6 0-12 4-12Z" fill="#ececec"/>
