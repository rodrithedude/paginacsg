<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <!-- Imagen provisional: reemplazar por una foto de edificios / obra -->
  <defs>
    <pattern id="win" width="26" height="22" patternUnits="userSpaceOnUse">
      <rect width="26" height="22" fill="#2b2b2b"/><rect x="3" y="3" width="20" height="15" fill="#1c1c1c"/>
      <rect x="3" y="3" width="20" height="3" fill="#3d3d3d"/>
    </pattern>
    <pattern id="fins" width="70" height="40" patternUnits="userSpaceOnUse">
      <rect width="70" height="40" fill="#222"/><rect width="14" height="40" fill="#6c6c6c"/>
      <rect x="14" width="4" height="40" fill="#3f3f3f"/><rect x="24" y="12" width="40" height="2" fill="#333"/>
    </pattern>
    <pattern id="win2" width="34" height="26" patternUnits="userSpaceOnUse">
      <rect width="34" height="26" fill="#323232"/><rect x="4" y="4" width="10" height="18" fill="#1a1a1a"/><rect x="18" y="4" width="10" height="18" fill="#202020"/>
    </pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .16 0"/></filter>
  </defs>
  <rect width="1600" height="700" fill="#8f8f8f"/>
  <rect x="0" y="0" width="470" height="700" fill="url(#win)"/>
  <rect x="470" y="0" width="70" height="700" fill="#161616"/>
  <rect x="540" y="90" width="560" height="610" fill="url(#fins)"/>
  <rect x="540" y="90" width="560" height="8" fill="#555"/>
  <rect x="760" y="0" width="160" height="90" fill="#6a6a6a"/>
  <rect x="1100" y="0" width="90" height="700" fill="#4a4a4a"/>
  <rect x="1190" y="0" width="200" height="700" fill="url(#win2)"/>
  <rect x="1260" y="40" width="110" height="660" fill="#7d7d7d"/>
  <rect x="1300" y="40" width="8" height="660" fill="#5a5a5a"/>
  <rect x="1390" y="0" width="210" height="700" fill="url(#win)"/>
  <rect width="1600" height="700" filter="url(#grain)"/>
</svg>
