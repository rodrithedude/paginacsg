  <path d="M175 600c4-120 50-205 135-212 85 7 131 92 135 212Z" fill="#d9d9d9"/>
  <path d="M182 520h256v26H182zM190 455h240v24H190z" fill="#f4f4f4"/>
  <path d="M182 520h256v4H182zM190 455h240v4H190z" fill="#9d9d9d"/>
  <path d="M296 380h28v220h-28z" fill="#bdbdbd"/>
