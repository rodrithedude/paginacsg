<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice">
  <!-- Imagen provisional: reemplazar por la foto del proyecto -->
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdbdbd"/><stop offset="1" stop-color="#e9e9e9"/>
    </linearGradient>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c3c"/><stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .45 0 0 0 0 .45 0 0 0 .2 0"/></filter>
  </defs>
  <!-- punto de fuga en (430, 250) -->
  <rect width="800" height="560" fill="#9a9a9a"/>
  <polygon points="0,0 800,0 800,90 470,225 390,225 0,60" fill="url(#ceil)"/>
  <polygon points="0,560 800,560 800,420 470,280 390,280 0,470" fill="url(#floor)"/>
  <polygon points="0,60 390,225 390,280 0,470" fill="#cfcfcf"/>
  <polygon points="800,90 470,225 470,280 800,420" fill="#adadad"/>
  <rect x="390" y="225" width="80" height="55" fill="#f2f2f2"/>
  <!-- cerchas -->
  <g stroke="#2a2a2a" stroke-width="4" fill="none">
    <path d="M0 22 800 50M120 73 690 88M250 128 590 135M330 172 520 175"/>
    <path d="M60 0 120 73M200 0 250 128M330 0 330 172M470 0 520 175M610 0 590 135M740 0 690 88"/>
  </g>
  <g fill="#fff" opacity=".9">
    <rect x="160" y="40" width="70" height="8"/><rect x="520" y="54" width="70" height="8"/>
    <rect x="300" y="110" width="44" height="6"/><rect x="470" y="116" width="44" height="6"/>
  </g>
  <!-- columnas -->
  <g fill="#e5e5e5"><rect x="110" y="70" width="16" height="420"/><rect x="250" y="128" width="11" height="240"/><rect x="590" y="135" width="11" height="220"/><rect x="690" y="88" width="16" height="330"/></g>
  <!-- máquinas -->
  <rect x="140" y="330" width="120" height="110" fill="#5a5a5a"/>
  <rect x="140" y="330" width="120" height="18" fill="#2e2e2e"/>
  <rect x="270" y="300" width="80" height="70" fill="#6e6e6e"/>
  <rect x="540" y="300" width="110" height="80" fill="#444"/>
  <rect x="660" y="330" width="140" height="120" fill="#e8e8e8"/>
  <rect x="660" y="330" width="140" height="120" fill="none" stroke="#555" stroke-width="3"/>
  <path d="M705 360l20 34h-40Z" fill="#333"/>
  <!-- líneas de piso -->
  <g stroke="#fff" stroke-width="6"><path d="M260 560 405 282M560 560 455 282"/></g>
  <rect width="800" height="560" filter="url(#grain)"/>
</svg>
