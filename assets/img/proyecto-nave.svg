<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice">
  <!-- Imagen provisional: reemplazar por la foto del proyecto -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2c2c2"/><stop offset="1" stop-color="#e6e6e6"/>
    </linearGradient>
    <pattern id="clad" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="2" height="10" fill="#000" fill-opacity=".12"/></pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .45 0 0 0 0 .45 0 0 0 .2 0"/></filter>
  </defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <!-- nave en perspectiva -->
  <polygon points="40,210 560,150 560,390 40,400" fill="#d2d2d2"/>
  <polygon points="40,210 560,150 560,390 40,400" fill="url(#clad)"/>
  <polygon points="560,150 760,190 760,380 560,390" fill="#9d9d9d"/>
  <polygon points="560,150 760,190 760,380 560,390" fill="url(#clad)"/>
  <!-- techo dientes de sierra -->
  <path d="M40 210 120 170v31l80-40v31l80-40v31l80-40v31l80-40v31l80-40v31l40-20" fill="none" stroke="#4d4d4d" stroke-width="5"/>
  <polygon points="560,150 760,190 760,176 600,138" fill="#6d6d6d"/>
  <!-- franja -->
  <polygon points="40,240 560,190 560,204 40,254" fill="#3d3d3d"/>
  <!-- andenes -->
  <g fill="#333">
    <rect x="90" y="300" width="56" height="94"/><rect x="170" y="296" width="56" height="96"/>
    <rect x="250" y="292" width="56" height="98"/><rect x="330" y="288" width="56" height="100"/>
    <rect x="410" y="284" width="56" height="102"/>
  </g>
  <g fill="#6a6a6a"><rect x="90" y="300" width="56" height="8"/><rect x="170" y="296" width="56" height="8"/><rect x="250" y="292" width="56" height="8"/><rect x="330" y="288" width="56" height="8"/><rect x="410" y="284" width="56" height="8"/></g>
  <!-- piso / patio -->
  <polygon points="0,400 800,380 800,560 0,560" fill="#9c9c9c"/>
  <g stroke="#e8e8e8" stroke-width="4"><path d="M118 404 60 560M198 402 170 560M278 400 280 560M358 398 390 560M438 396 500 560"/></g>
  <!-- camión -->
  <rect x="560" y="330" width="170" height="70" fill="#f0f0f0"/>
  <rect x="560" y="330" width="170" height="70" fill="none" stroke="#555" stroke-width="3"/>
  <path d="M730 350h40l20 26v24h-60Z" fill="#3a3a3a"/>
  <circle cx="600" cy="404" r="14" fill="#1f1f1f"/><circle cx="700" cy="404" r="14" fill="#1f1f1f"/><circle cx="760" cy="404" r="14" fill="#1f1f1f"/>
  <rect width="800" height="560" filter="url(#grain)"/>
</svg>
