    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e9e9e"/><stop offset=".7" stop-color="#d4d4d4"/><stop offset="1" stop-color="#e2e2e2"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d7d7d"/><stop offset=".35" stop-color="#e6e6e6"/><stop offset="1" stop-color="#6a6a6a"/>
